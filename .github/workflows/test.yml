name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-25.05
      - name: Fetch combparser
        run: git clone --depth 1 https://github.com/PMunch/combparser.git /tmp/combparser
      - name: Run tests
        run: |
          nix-shell -p nim --run '
            set -e
            for t in tests/t*.nim; do
              echo "== $t"
              nim c -r --hints:off --warnings:off --path:/tmp/combparser/src --outdir:/tmp/bin "$t"
            done'

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-25.05
      - name: Fetch combparser
        run: git clone --depth 1 https://github.com/PMunch/combparser.git /tmp/combparser
      - name: Run conformance suite
        run: NIMFLAGS="--path:/tmp/combparser/src" tests/conformance/run.sh
